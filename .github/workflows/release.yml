name: GitHub Release

# Creates the GitHub Release for a version tag and marks it Latest.
# Notes come from .github/releases/<tag>.md (first line = title) when present,
# otherwise from the matching CHANGELOG.md section.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/releases/**', '.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag=$(git describe --tags --abbrev=0); fi
          notes=".github/releases/$tag.md"
          if [ -f "$notes" ]; then
            title=$(head -n1 "$notes")
            tail -n +2 "$notes" > body.md
          else
            title="$tag"
            awk -v v="${tag#v}" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md > body.md
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file body.md --latest
          else
            gh release create "$tag" --verify-tag --latest --title "$title" --notes-file body.md
          fi
