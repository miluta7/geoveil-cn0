<svg xmlns="http://www.w3.org/2000/svg" width="700" height="160" viewBox="0 0 700 160">
  <rect width="700" height="160" fill="#070d14" rx="10"/>

  <!-- Jamming card -->
  <rect x="15" y="10" width="210" height="140" rx="8" fill="#0f2318" stroke="#1e3a2e" stroke-width="1.5"/>
  <!-- lightning bolt icon -->
  <polygon points="123,24 115,46 121,46 116,62 130,42 123,42" fill="#fbbf24"/>
  <text x="120" y="80" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600" font-family="system-ui,sans-serif">Jamming</text>
  <rect x="88" y="88" width="64" height="22" rx="11" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="120" y="103" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">CLEAN</text>
  <text x="120" y="128" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui,sans-serif">Rapid drop rate &lt;6 dB/3s</text>

  <!-- Spoofing card -->
  <rect x="235" y="10" width="210" height="140" rx="8" fill="#0f2318" stroke="#1e3a2e" stroke-width="1.5"/>
  <!-- eye icon -->
  <path d="M322,43 Q340,28 358,43 Q340,58 322,43 Z" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="340" cy="43" r="7" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="340" cy="43" r="3" fill="#a78bfa"/>
  <text x="340" y="80" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600" font-family="system-ui,sans-serif">Spoofing</text>
  <rect x="308" y="88" width="64" height="22" rx="11" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="340" y="103" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">CLEAN</text>
  <text x="340" y="128" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui,sans-serif">Unexpected sats &lt;8% ratio</text>

  <!-- Interference card -->
  <rect x="455" y="10" width="210" height="140" rx="8" fill="#0f2318" stroke="#1e3a2e" stroke-width="1.5"/>
  <!-- signal arcs icon -->
  <circle cx="556" cy="50" r="4" fill="#f97316"/>
  <path d="M545,60 Q545,35 568,35" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M540,65 Q540,26 573,26" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M535,70 Q535,17 578,17" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
  <text x="560" y="80" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600" font-family="system-ui,sans-serif">Interference</text>
  <rect x="528" y="88" width="64" height="22" rx="11" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="560" y="103" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">CLEAN</text>
  <text x="560" y="128" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui,sans-serif">Sustained drop &lt;4 dB</text>

</svg>
