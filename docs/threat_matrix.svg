<svg xmlns="http://www.w3.org/2000/svg" width="700" height="160" viewBox="0 0 700 160">
  <rect width="700" height="160" fill="#070d14" rx="10"/>
  <!-- Header -->
  <text x="350" y="10" text-anchor="middle" fill="#94a3b8" font-size="0" font-family="system-ui,sans-serif">Threat Matrix</text>
  
  <!-- Jamming card -->
  <rect x="15" y="10" width="210" height="140" rx="8" fill="#0f2318" stroke="#1e3a2e" stroke-width="1.5"/>
  <text x="120" y="52" text-anchor="middle" font-size="28" font-family="system-ui,sans-serif">⚡</text>
  <text x="120" y="76" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600" font-family="system-ui,sans-serif">Jamming</text>
  <!-- status badge -->
  <rect x="88" y="85" width="64" height="22" rx="11" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="120" y="100" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">CLEAN</text>
  <!-- description -->
  <text x="120" y="124" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui,sans-serif">Rapid drop rate <6 dB/3s</text>

  <!-- Spoofing card -->
  <rect x="235" y="10" width="210" height="140" rx="8" fill="#0f2318" stroke="#1e3a2e" stroke-width="1.5"/>
  <text x="340" y="52" text-anchor="middle" font-size="28" font-family="system-ui,sans-serif">👁</text>
  <text x="340" y="76" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600" font-family="system-ui,sans-serif">Spoofing</text>
  <!-- status badge -->
  <rect x="308" y="85" width="64" height="22" rx="11" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="340" y="100" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">CLEAN</text>
  <!-- description -->
  <text x="340" y="124" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui,sans-serif">Unexpected sats <8% ratio</text>

  <!-- Interference card -->
  <rect x="455" y="10" width="210" height="140" rx="8" fill="#0f2318" stroke="#1e3a2e" stroke-width="1.5"/>
  <text x="560" y="52" text-anchor="middle" font-size="28" font-family="system-ui,sans-serif">📡</text>
  <text x="560" y="76" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600" font-family="system-ui,sans-serif">Interference</text>
  <!-- status badge -->
  <rect x="528" y="85" width="64" height="22" rx="11" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="560" y="100" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700" font-family="system-ui,sans-serif" letter-spacing="1">CLEAN</text>
  <!-- description -->
  <text x="560" y="124" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui,sans-serif">Sustained drop <4 dB</text>

</svg>